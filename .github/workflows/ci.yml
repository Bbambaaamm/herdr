name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  NPM_VERSION: "11.17.0"

jobs:
  contract:
    name: Herdr contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate repository and provenance contracts
        run: |
          python scripts/validate_repo.py
          sha256sum -c provenance/CANONICAL_SOURCE_MANIFEST.sha256
      - name: Validate Python dashboard and telemetry
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m compileall -q agent_platform_dashboard tests integrations/search-router
          python -m pytest -q tests/agent_platform_dashboard tests/test_observability_contract.py
      - name: Validate deployment and shell entrypoints
        run: |
          python -m json.tool deploy/agent_platform/production/herdr.example.json >/dev/null
          python -m json.tool deploy/agent_platform/production/sources.example.json >/dev/null
          python -m json.tool deploy/agent_platform/production/web.example.json >/dev/null
          bash -n agent-stack/install-agent-stack-service.sh
          bash -n scripts/build-machine-city.sh
          bash -n integrations/search-router/install.sh
          python -m py_compile integrations/search-router/__init__.py
      - name: Validate deterministic browser bundle
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          test "$(node -p "require('./package.json').packageManager")" = "npm@${NPM_VERSION}"
          npm ci
          npm test
          npm run build
          git diff --exit-code -- agent_platform_dashboard/static/machine-city.js
      - name: Audit production browser dependencies
        run: npm audit --omit=dev --audit-level=high
