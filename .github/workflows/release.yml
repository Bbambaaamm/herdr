name: Release bundle

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  NPM_VERSION: "11.17.0"

jobs:
  bundle:
    name: Immutable Herdr release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require annotated immutable tag
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_object="$(git ls-remote --refs origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          test -n "$tag_object"
          test "$(git cat-file -t "$tag_object")" = tag
          test "$(git rev-parse "${tag_object}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          # checkout resolves an annotated tag to its commit and rewrites the
          # local tag ref. Restore the verified remote object for the builder.
          git update-ref "$tag_ref" "$tag_object"
          test "$(git cat-file -t "$tag_ref")" = tag
      - name: Validate full repository contract
        run: |
          python scripts/validate_repo.py
          sha256sum -c provenance/CANONICAL_SOURCE_MANIFEST.sha256
          python -m pip install --disable-pip-version-check pytest==8.4.2 cryptography==50.0.0
          python -m compileall -q herdr deploy agent_platform_dashboard tests integrations/search-router
          python -m pytest -q tests
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          npm ci
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Build deterministic release archive
        run: |
          mkdir -p dist
          archive="dist/herdr-${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}.tar.gz"
          python scripts/build-herdr-release.py \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --output "$archive"
          sha256sum "$archive" | tee "$archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: herdr-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
